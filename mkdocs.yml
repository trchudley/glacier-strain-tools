site_name: Glacier Strain Tools
site_description: Python tools to derive glacier strain rates
site_url: https://trchudley.github.io/glacier-strain-tools/
repo_url: https://github.com/trchudley/glacier-strain-tools/
repo_name: "glacier-strain-tools"

# Activate this when building the docs locally to avoid broken links in the local build
# use_directory_urls: false

theme:
  name: material
  # favicon: assets/favicon.png
  # logo: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Open Sans
    code: Open Sans Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections

copyright: >
  &copy; Tom Chudley —
  <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank">CC BY 4.0</a>

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/trchudley/
      name: Tom Chudley on GitHub
    - icon: fontawesome/solid/globe
      link: https://trchudley.github.io
      name: Tom Chudley's website

nav:
  - Home:
    - index.md
    - installation.md
    - howtocite.md
    - references.md
  - User Guide:
    - userguide/index.md
    - Principles:
      - Strain Rates: userguide/strainprinciples.md
      - Stress: userguide/stressprinciples.md
    - Python:
      - Strain Rates: userguide/strain.ipynb
      # - Stresses: userguide/stress.ipynb
    - Command Line: userguide/commandline.md
  - API: 
    - Strain rates: api/strain.md
    - Stress: api/stress.md
    - Plotting Tools: api/plot.md

plugins:
  - mkdocs-jupyter:
      execute: false
      include_source: True
      custom_mathjax_url: "https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/latest.js?config=TeX-AMS_CHTML-full,Safe"
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
  # - privacy

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: "#"
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
